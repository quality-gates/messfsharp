name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Validate stable semantic version tag
        id: version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"

      - name: Restore
        run: dotnet restore messfsharp.sln --locked-mode

      - name: Build Release
        run: dotnet build messfsharp.sln --configuration Release --no-restore -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Run tests
        run: dotnet test tests/MessFSharp.Tests/MessFSharp.Tests.fsproj --configuration Release --no-build --no-restore

      - name: Self-analyze production source
        run: >-
          dotnet src/MessFSharp/bin/Release/net10.0/messfsharp.dll
          src/MessFSharp text fsharp,codesize,design --ignore-tests

      - name: Pack
        shell: bash
        run: |
          dotnet pack src/MessFSharp/MessFSharp.fsproj --configuration Release --no-build --no-restore -p:PackageVersion=${{ steps.version.outputs.version }}
          package="artifacts/packages/messfsharp.${{ steps.version.outputs.version }}.nupkg"
          unzip -p "$package" messfsharp.nuspec > "$RUNNER_TEMP/messfsharp.nuspec"
          grep -F '<id>messfsharp</id>' "$RUNNER_TEMP/messfsharp.nuspec"
          grep -F '<version>${{ steps.version.outputs.version }}</version>' "$RUNNER_TEMP/messfsharp.nuspec"
          grep -F '<license type="expression">MIT</license>' "$RUNNER_TEMP/messfsharp.nuspec"
          grep -F '<readme>README.md</readme>' "$RUNNER_TEMP/messfsharp.nuspec"
          unzip -l "$package" | grep -F 'tools/net10.0/any/DotnetToolSettings.xml'
          unzip -l "$package" | grep -F 'README.md'

      - name: Install and smoke-test exact package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/messfsharp-tool"
          package="artifacts/packages/messfsharp.${{ steps.version.outputs.version }}.nupkg"
          dotnet tool install --tool-path "$RUNNER_TEMP/messfsharp-tool" --add-source artifacts/packages messfsharp --version "${{ steps.version.outputs.version }}"
          actual_version="$("$RUNNER_TEMP/messfsharp-tool/messfsharp" --version)"
          test "$actual_version" = "messfsharp ${{ steps.version.outputs.version }}"
          "$RUNNER_TEMP/messfsharp-tool/messfsharp" tests/Fixtures/clean.fs json fsharp --reportfile "$RUNNER_TEMP/smoke.json"
          jq -e --arg expected "${{ steps.version.outputs.version }}" '.tool == "messfsharp" and .version == $expected and (.errors | length == 0)' "$RUNNER_TEMP/smoke.json" >/dev/null
          test -s "$package"

      - name: Create checksums
        run: sha256sum artifacts/packages/messfsharp.${{ steps.version.outputs.version }}.nupkg > artifacts/packages/SHA256SUMS

      - name: Publish NuGet package when credentials are provisioned
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          package="artifacts/packages/messfsharp.${{ steps.version.outputs.version }}.nupkg"

          if [[ -n "$NUGET_API_KEY" ]]; then
            published="$RUNNER_TEMP/published.nupkg"
            url="https://api.nuget.org/v3-flatcontainer/messfsharp/${{ steps.version.outputs.version }}/messfsharp.${{ steps.version.outputs.version }}.nupkg"

            if ! status="$(curl --silent --show-error --location --output "$published" --write-out '%{http_code}' "$url")"; then
              echo "Could not determine whether this NuGet version is already published."
              exit 1
            fi

            if [[ "$status" == "200" ]]; then
              bash scripts/compare-nuget-package-payload.sh "$package" "$published"
              echo "The identical package is already published."
            elif [[ "$status" == "404" ]]; then
              dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
            else
              echo "NuGet returned unexpected status $status while checking the existing package."
              exit 1
            fi
          else
            echo "NUGET_API_KEY is not provisioned; keeping publication gated after verification."
          fi

      - name: Create or verify immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package="artifacts/packages/messfsharp.${{ steps.version.outputs.version }}.nupkg"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$GITHUB_REF_NAME" --pattern "messfsharp.${{ steps.version.outputs.version }}.nupkg" --dir "$RUNNER_TEMP/existing-release"
            bash scripts/compare-nuget-package-payload.sh \
              "$package" \
              "$RUNNER_TEMP/existing-release/$(basename "$package")"
            echo "The existing release contains the same verified package payload."
          else
            gh release create "$GITHUB_REF_NAME" \
              "$package" \
              artifacts/packages/SHA256SUMS \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file CHANGELOG.md
          fi
