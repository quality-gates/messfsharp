name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag and source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      immutable_release: ${{ steps.release.outputs.immutable_release }}
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - id: release
        name: Validate the stable release identity
        uses: quality-gates/homebrew-tap/.github/actions/validate-source-release@92b635fe61fb926a5b13c7c59f163c3cec3ca756
        with:
          tool: messfsharp
          tag: ${{ env.TAG }}
          github-token: ${{ github.token }}


  test:
    name: Test release source
    needs: validate
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore messfsharp.sln --locked-mode

      - name: Build Release
        run: >-
          dotnet build messfsharp.sln
          --configuration Release
          --no-restore
          -p:PackageVersion=${{ needs.validate.outputs.version }}

      - name: Run tests
        run: >-
          dotnet test tests/MessFSharp.Tests/MessFSharp.Tests.fsproj
          --configuration Release
          --no-build
          --no-restore

      - name: Self-analyze production source
        run: >-
          dotnet src/MessFSharp/bin/Release/net10.0/messfsharp.dll
          src/MessFSharp text fsharp,codesize,design --ignore-tests

  build:
    name: Build darwin/${{ matrix.arch }}
    needs: [validate, test]
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Check out validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore runtime packages
        run: dotnet restore src/MessFSharp/MessFSharp.fsproj --locked-mode

      - name: Build deterministic self-contained archive
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          scripts/build-macos-release-archive.sh "$VERSION" "$ARCH" "$source_date_epoch" dist
          scripts/verify-macos-release-archive.sh \
            "dist/messfsharp_${VERSION}_darwin_${ARCH}.tar.gz" \
            "$VERSION" "$ARCH"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: messfsharp-darwin-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release assets
    needs: [validate, build]
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: messfsharp-darwin-*
          path: dist
          merge-multiple: true

      - name: Create checksum manifest
        working-directory: dist
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            "messfsharp_${VERSION}_darwin_amd64.tar.gz" \
            "messfsharp_${VERSION}_darwin_arm64.tar.gz")"
          actual="$(find . -maxdepth 1 -type f -name '*.tar.gz' -exec basename {} \; | LC_ALL=C sort)"
          test "$actual" = "$expected"
          sha256sum messfsharp_*.tar.gz | LC_ALL=C sort > checksums.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build and smoke-test the NuGet release asset
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore messfsharp.sln --locked-mode
          dotnet build messfsharp.sln --configuration Release --no-restore -p:PackageVersion="$VERSION"
          dotnet pack src/MessFSharp/MessFSharp.fsproj \
            --configuration Release --no-build --no-restore -p:PackageVersion="$VERSION"
          package="artifacts/packages/messfsharp.${VERSION}.nupkg"
          scripts/smoke-nuget-package.sh \
            artifacts/packages "$VERSION" "$RUNNER_TEMP/package-smoke"
          cp "$package" dist/
          (cd dist && sha256sum "messfsharp.${VERSION}.nupkg" > SHA256SUMS)

      - name: Upload complete release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke test ${{ matrix.runner }}
    needs: [validate, package]
    if: needs.validate.outputs.immutable_release != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: dist

      - name: Verify checksums and run packaged executable
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c checksums.txt)
          scripts/verify-macos-release-archive.sh \
            "dist/messfsharp_${VERSION}_darwin_${ARCH}.tar.gz" \
            "$VERSION" "$ARCH" --run

  publish:
    name: Publish the immutable release and Homebrew formula
    needs: [validate, smoke]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.smoke.result == 'success' || needs.validate.outputs.immutable_release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 135
    environment: homebrew
    permissions:
      contents: write
    steps:
      - uses: quality-gates/homebrew-tap/.github/actions/publish-source-release@92b635fe61fb926a5b13c7c59f163c3cec3ca756
        with:
          tool: messfsharp
          tag: ${{ env.TAG }}
          version: ${{ needs.validate.outputs.version }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
          immutable-release: ${{ needs.validate.outputs.immutable_release }}
          extra-assets: |
            messfsharp.${{ needs.validate.outputs.version }}.nupkg
            SHA256SUMS
          github-token: ${{ github.token }}
          tap-app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          tap-app-private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}

  nuget:
    name: Publish the immutable NuGet release asset when provisioned
    needs: [validate, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Download and smoke-test the immutable package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$TAG" \
            --pattern "messfsharp.${VERSION}.nupkg" \
            --pattern SHA256SUMS \
            --dir dist
          test "$(awk 'NF == 2 { print $2 }' dist/SHA256SUMS)" = \
            "messfsharp.${VERSION}.nupkg"
          (cd dist && sha256sum -c SHA256SUMS)
          scripts/smoke-nuget-package.sh \
            dist "$VERSION" "$RUNNER_TEMP/package-smoke"

      - name: Publish or verify the NuGet package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package="dist/messfsharp.${VERSION}.nupkg"
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "NUGET_API_KEY is not provisioned; the verified package was not published."
            exit 0
          fi

          published="$RUNNER_TEMP/published.nupkg"
          url="https://api.nuget.org/v3-flatcontainer/messfsharp/${VERSION}/messfsharp.${VERSION}.nupkg"
          status="$(curl --silent --show-error --location \
            --output "$published" --write-out '%{http_code}' "$url")"
          if [[ "$status" == "200" ]]; then
            scripts/compare-nuget-package-payload.sh "$package" "$published"
            echo "The identical NuGet package is already published."
          elif [[ "$status" == "404" ]]; then
            dotnet nuget push "$package"               --api-key "$NUGET_API_KEY"               --source https://api.nuget.org/v3/index.json
          else
            echo "NuGet returned unexpected status $status." >&2
            exit 1
          fi
