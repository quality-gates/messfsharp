name: Code quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify license
        run: test -s LICENSE

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore messfsharp.sln --locked-mode

      - name: Check F# formatting
        shell: bash
        run: |
          readarray -t files < <(git ls-files '*.fs' '*.fsi' '*.fsx' ':!tests/Fixtures/invalid.fs')
          dotnet tool run fantomas --check "${files[@]}"

      - name: Build with warnings as errors
        run: dotnet build messfsharp.sln --configuration Release --no-restore -warnaserror
